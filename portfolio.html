<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Freelance, Graphic, Web application, Algorithm, Frontend, Backend, Full-Stack, Developer, MERN stack, MongoDB, Express, React, NodeJS, UXUI">
    <title>zixma - All the sum</title>
    <link rel="shortcut icon" href="./src/img/icon/zmlogo-page-03.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/dist/stylingtag.css">
    <link rel="stylesheet" href="./src/style/main.css">
    <link rel="stylesheet" href="./src/dist/style.css">
    <link rel="stylesheet" href="./src/dist/portfolio.css">
    <link rel="stylesheet" href="./src/dist/sidemenu.css">
    <link rel="stylesheet" href="./src/dist/hamburger.css">
    <link rel="stylesheet" href="./src/dist/totop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script type="module">
        import layout from './src/scripts/Components/layout.js'
        const imgs = () => {
            let x = ''
            for (let i = 1; i <= 13; i++) {
                x += `<img src="./src/img/portfolio/low-portfolio_graphic_design-${i}.jpg" class="port-img" alt="portfolio-graphic-design"/>`
            }
            return x
        }
        const vid = () => {
            let x = ''
            for (let i = 1; i <= 36; i++) {
                x += `<div class="col-4">
                        <video controls width="100%">
                            <source src="./src/reels/portfolio/vid (${i}).mp4" type="video/mp4" />
                        </video>
                    </div>`
            }
            return x
        }
        const children = `
        <div class="container">
            <p class="tagLists">graphic-design, motion-graphic</p>
            <div class="filterPortfolioBtnWrapper">
                <button type="button" id="filterPhotoBtn" name="filterPhotoBtn" class="filterPortBtn">Photos</button>
                <button type="button" id="filterMotionBtn" name="filterMotionBtn" class="filterPortBtn">Motion</button>
                <button type="reset" id="resetFilterBtn" name="resetFilterBtn" class="resetFilterBtn">Reset</button>
            </div>
            <div class="row" id="portImage" class>
                <div class="col-auto">
                    <div class="portfolio-wrapper">
                        ${await imgs()}
                    </div>
                </div>
            </div>
            <div class="row" id="portVid" class>
                ${await vid()}
            </div>
        </div>
        `
        layout(children)
            .then(async html => {
                document.body.innerHTML += await html
                const filterPhotoBtn = await document.getElementById('filterPhotoBtn')
                const filterMotionBtn = await document.getElementById('filterMotionBtn')
                const resetFilterBtn = await document.getElementById('resetFilterBtn')
                const portImage = await document.getElementById('portImage')
                const portVid = await document.getElementById('portVid')

                filterPhotoBtn.addEventListener('click', e => {
                    portVid.classList.add('hidePort')
                    portImage.classList.remove('hidePort')
                    e.target.classList.add('active')
                    filterMotionBtn.classList.remove('active')
                })
                filterMotionBtn.addEventListener('click', e => {
                    portImage.classList.add('hidePort')
                    portVid.classList.remove('hidePort')
                    e.target.classList.add('active')
                    filterPhotoBtn.classList.remove('active')
                })
                resetFilterBtn.addEventListener('click', e => {
                    portVid.classList.remove('hidePort')
                    portImage.classList.remove('hidePort')
                    filterPhotoBtn.classList.remove('active')
                    filterMotionBtn.classList.remove('active')
                })
            })
            .then(res => {
                sidemenu()
                new Promise((resolve, reject) => {
                    const script = document.createElement('script')
                    script.src = './src/scripts/stylingtag.js'
                    script.defer = true
                    script.onload = resolve
                    script.onerror = reject
                    document.body.appendChild(script)
                })
            })
    </script>
    <script src="./src/scripts/sidemenu.js" defer></script>
    <script src="./src/scripts/totop.js" defer></script>
</body>
</html>
